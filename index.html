<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OOP Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Task Manager</h1>
      <p class="app__subtitle">OOP Practice Project</p>
    </header>

    <form class="task-form" id="taskForm">
      <input
        type="text"
        id="taskInput"
        class="task-form__input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      />
      <select id="prioritySelect" class="task-form__select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="urgent">Urgent</option>
      </select>
      <button type="submit" class="task-form__btn">Add</button>
    </form>

    <div class="filters" id="filters">
      <button class="filters__btn is-active" data-filter="all">All</button>
      <button class="filters__btn" data-filter="active">Active</button>
      <button class="filters__btn" data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <footer class="app__footer">
      <span id="taskCount">0 tasks</span>
      <button id="clearCompleted" class="app__clear">Clear Completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
